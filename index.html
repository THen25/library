<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <h1 class="header-title">My Library</h1>
        <button type="button" id="newBookBtn" class="btn btn-primary">+ Add Book</button>
      </div>
    </header>

    <main>
      <div class="bookGrid"></div>
    </main>

    <dialog id="dialog">
      <form id="bookForm">
        <div class="dialog-header">
          <h2>Add New Book</h2>
          <button type="button" id="closeDialog" class="close-btn">&times;</button>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Enter book title" required />
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" name="author" placeholder="Enter author name" required />
        </div>

        <div class="form-group">
          <label for="pages">Pages</label>
          <input type="number" id="pages" name="pages" placeholder="Number of pages" min="1" required />
        </div>

        <div class="form-group form-group--checkbox">
          <label class="checkbox-label">
            <input type="checkbox" name="read" id="read" />
            I've read this book
          </label>
        </div>

        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Book</button>
        </div>
      </form>
    </dialog>

    <script src="assets/js/index.js"></script>
  </body>
</html>
